name: Translation review
description: Suggest better Spanish or Arabic wording.
title: '[Translation] <language>: <where>'
labels: ['i18n', 'translation-review']
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Español
        - العربية
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you saw it
      description: The page address, and the place on the page.
      placeholder: https://lab.suprabhat-dev.com/es/compare/, the verdict box
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (optional)
      description: Grammar, tone, regional usage, a term a screen reader mispronounces…
  - type: input
    id: credit
    attributes:
      label: How to credit you
      description: A name or handle, or leave empty to stay anonymous.
