name: Screen reader result
description: Report what you heard running the screen reader test script.
title: '[Screen reader] <setup>: <scenarios tested>'
labels: ['accessibility', 'screen-reader-result']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Follow the script at
        https://lab.suprabhat-dev.com/accessibility/screen-readers/
        and report every scenario you ran, including the ones that passed.
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - NVDA with Firefox on Windows
        - VoiceOver with Safari on macOS
        - VoiceOver with Safari on iPhone
        - TalkBack with Chrome on Android
        - Other (describe in versions)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Exact versions
      placeholder: NVDA 2026.2, Firefox 141, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - React
        - Framework-free TypeScript
        - Both
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Page language
      options:
        - English
        - Español
        - العربية
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Result per scenario
      description: Pass, partly or fail for each scenario you ran.
      value: |
        - Loaded:
        - Loading:
        - Slow response:
        - Empty results:
        - Error with retry:
        - Restricted access:
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What differed from the script
      description: Exactly what you heard where it differed, and anything that was confusing even if it matched.
  - type: input
    id: credit
    attributes:
      label: How to credit you
      description: A name or handle, or leave empty to stay anonymous.
